<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Customer Churn Intelligence — Stlite</title>
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Stlite JS Engine -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";

      mount(
        {
          requirements: ["streamlit", "pandas", "numpy", "scikit-learn<1.8", "joblib", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "https://raw.githubusercontent.com/sgrouplabs/datafolio/main/01_customer_retention_intelligence/app.py"
            },
            "models/churn_classifier.joblib": {
              url: "https://raw.githubusercontent.com/sgrouplabs/datafolio/main/01_customer_retention_intelligence/models/churn_classifier.joblib"
            },
            "models/preprocessor.joblib": {
              url: "https://raw.githubusercontent.com/sgrouplabs/datafolio/main/01_customer_retention_intelligence/models/preprocessor.joblib"
            },
            "data/telco_churn.csv": {
              url: "https://raw.githubusercontent.com/sgrouplabs/datafolio/main/01_customer_retention_intelligence/data/telco_churn.csv"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
