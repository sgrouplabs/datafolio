<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Auto Collision Risk Matrix — Stlite</title>
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Stlite JS Engine -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";

      mount(
        {
          requirements: ["streamlit", "pandas", "numpy", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "https://raw.githubusercontent.com/sgrouplabs/datafolio/main/06_auto_collision_risk_matrix/scripts/03_dashboard.py"
            },
            "data/processed/tx_collision_risk.csv": {
              url: "https://raw.githubusercontent.com/sgrouplabs/datafolio/main/06_auto_collision_risk_matrix/data/processed/tx_collision_risk_sample.csv"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
